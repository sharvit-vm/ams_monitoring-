services:

  # ══════════════════════════════════════════════════════════════════════════
  # SERVICE 1 — AMS Monitoring Intake + Categorisation
  # Embeds l2_rca and db_fix agents as in-process packages
  # ══════════════════════════════════════════════════════════════════════════
  - type: web
    name: ams-monitoring-intake-categorisation
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.11"
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: AI_TIMEOUT
        value: "30"
      - key: AUTO_ROUTE_L2_WITHOUT_HUMAN_REVIEW
        value: "true"
      - key: SN_INSTANCE
        sync: false
      - key: SN_USERNAME
        sync: false
      - key: SN_PASSWORD
        sync: false
      - key: JIRA_INSTANCE
        sync: false
      - key: JIRA_CREATE_ISSUE_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: GITHUB_WEBHOOK_SECRET
        sync: false
      - key: JIRA_WEBHOOK_TOKEN
        sync: false
      - key: SERVICENOW_WEBHOOK_TOKEN
        sync: false
      - key: JIRA_DEFAULT_REPO_URL
        sync: false
      - key: JIRA_DEFAULT_REPO_FULL_NAME
        sync: false
      - key: JIRA_DEFAULT_BRANCH
        value: main
      - key: SERVICENOW_DEFAULT_REPO_URL
        sync: false
      - key: SERVICENOW_DEFAULT_REPO_FULL_NAME
        sync: false
      - key: SERVICENOW_DEFAULT_BRANCH
        value: main
      - key: CATEGORISATION_INCLUDE_RAW_PAYLOAD
        value: "false"

  # ══════════════════════════════════════════════════════════════════════════
  # SERVICE 2 — Frontend React Dashboard
  # ══════════════════════════════════════════════════════════════════════════
  - type: web
    name: ams-ai-ops-dashboard
    runtime: static
    rootDir: frontend
    branch: enterprise-agentic-workflow
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: false
    envVars:
      - key: VITE_GATEWAY_URL
        sync: false

