services:

  # ══════════════════════════════════════════════════════════════════════════
  # SERVICE 1 — DB Fix Agent  (deploy first — no dependencies)
  # ══════════════════════════════════════════════════════════════════════════
  - type: web
    name: vm-db-fix-agent
    runtime: python
    plan: free
    rootDir: vm-db-fix-agent
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: SN_INSTANCE
        sync: false
      - key: SN_USERNAME
        sync: false
      - key: SN_PASSWORD
        sync: false
      - key: DATABASE_URL
        sync: false

  # ══════════════════════════════════════════════════════════════════════════
  # SERVICE 2 — L2 RCA Agent  (depends on DB Fix Agent URL)
  # ══════════════════════════════════════════════════════════════════════════
  - type: web
    name: vm-l2-rca-agent
    runtime: python
    plan: free
    rootDir: vm-l2-rca-agent
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: GROQ_API_KEY
        sync: false
      - key: DB_FIX_AGENT_URL
        sync: false

  # ══════════════════════════════════════════════════════════════════════════
  # SERVICE 3 — AMS Monitoring Intake + Categorisation  (depends on L2 RCA URL)
  # ══════════════════════════════════════════════════════════════════════════
  - type: web
    name: ams-monitoring-intake-categorisation
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.11"
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: AI_TIMEOUT
        value: "30"
      - key: AUTO_ROUTE_L2_WITHOUT_HUMAN_REVIEW
        value: "true"
      - key: L2_RCA_AGENT_URL
        sync: false
      - key: L2_RCA_TIMEOUT
        value: "120"
      - key: GITHUB_WEBHOOK_SECRET
        sync: false
      - key: JIRA_WEBHOOK_TOKEN
        sync: false
      - key: SERVICENOW_WEBHOOK_TOKEN
        sync: false
      - key: JIRA_DEFAULT_REPO_URL
        sync: false
      - key: JIRA_DEFAULT_REPO_FULL_NAME
        sync: false
      - key: JIRA_DEFAULT_BRANCH
        value: main
      - key: SERVICENOW_DEFAULT_REPO_URL
        sync: false
      - key: SERVICENOW_DEFAULT_REPO_FULL_NAME
        sync: false
      - key: SERVICENOW_DEFAULT_BRANCH
        value: main
      - key: CATEGORISATION_INCLUDE_RAW_PAYLOAD
        value: "false"

  # ══════════════════════════════════════════════════════════════════════════
  # SERVICE 4 — Frontend React Dashboard  (depends on AMS Monitoring URL)
  # ══════════════════════════════════════════════════════════════════════════
  - type: web
    name: ams-ai-ops-dashboard
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: false
    envVars:
      - key: VITE_GATEWAY_URL
        sync: false
